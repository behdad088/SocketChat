# Single CI entry point for all services in this repo.
#
# 1. `detect` job uses dorny/paths-filter to determine which services changed.
# 2. Each service job runs only when its files (or Shared) changed, or when
#    the workflow is dispatched manually with `force_all = true`.
# 3. Service jobs delegate to the reusable `_build-push.yml` workflow.
#
# Images are pushed to GHCR only on pushes to `main` (never on pull requests).
# Add a new service by adding a filter to `detect` and a job below that
# points at its project/test paths — mirrors the identity job.

name: CI

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build every service regardless of changed paths'
        type: boolean
        default: false
      image_tag_suffix:
        description: 'Optional suffix appended to image tags (e.g. "-hotfix1")'
        type: string
        default: ''
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read            # codeql-action/upload-sarif needs to read the workflow run (in _build-push.yml)
  pull-requests: write     # PR comment with image tags (in _build-push.yml)
  security-events: write   # Trivy SARIF upload (in _build-push.yml)
  checks: write            # dorny/test-reporter (in _build-push.yml)
  packages: write          # push to ghcr.io (in _build-push.yml)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      identity: ${{ steps.changes.outputs.identity }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect path changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'src/Services/Shared/**'
              - 'src/Directory.Packages.props'
              - 'src/SocketChat.sln'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_build-push.yml'
            identity:
              - 'src/Services/Identity/**'
            web:
              - 'src/web/**'

  identity:
    name: Identity API
    needs: detect
    if: |
      needs.detect.outputs.identity == 'true' ||
      needs.detect.outputs.shared == 'true' ||
      github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-push.yml
    with:
      service: identity-api
      image_name: socketchat-identity.api
      project_path: src/Services/Identity/Identity.API
      test_path: src/Services/Identity/Identity.API.Tests
      push_image: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      image_tag_suffix: ${{ github.event.inputs.image_tag_suffix }}
    secrets: inherit

  # Node/Docker, not .NET — builds and scans its own image inline rather than
  # going through the dotnet-oriented _build-push.yml reusable workflow.
  web:
    name: Web
    needs: detect
    if: |
      needs.detect.outputs.web == 'true' ||
      github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Inherits contents/actions/pull-requests/security-events/packages
    # permissions from the workflow-level block above — a job-level
    # `permissions:` here would replace rather than merge with it, and
    # silently drop `actions: read` (needed by codeql-action/upload-sarif).
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/socketchat-web
          flavor: |
            latest=false
            suffix=${{ github.event.inputs.image_tag_suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=short

      - name: Build image (PR — single-arch, load locally)
        if: env.PUSH_IMAGE != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/web
          file: ./src/web/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          platforms: linux/amd64

      - name: Build & push image (main — multi-arch)
        if: env.PUSH_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./src/web
          file: ./src/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          platforms: linux/amd64,linux/arm64

      - name: Resolve primary image ref for scan
        id: img
        run: |
          REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: sarif
          output: trivy.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-web

      - name: Find existing image-tags PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: "<!-- image-tags:web -->"

      - name: Upsert PR comment with image tags
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- image-tags:web -->
            **web** — image built ${{ env.PUSH_IMAGE == 'true' && '& pushed' || '(not pushed; PR build)' }}

            ```text
            ${{ steps.meta.outputs.tags }}
            ```

  # Aggregate gate so branch protection only needs to require one check.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs:
      - detect
      - identity
      - web
    if: always()
    steps:
      - name: Verify all required jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          bad = [k for k, v in data.items() if v.get("result") not in ("success", "skipped")]
          if bad:
              print(f"Failing jobs: {bad}")
              sys.exit(1)
          print("All jobs succeeded or were skipped.")
          '
