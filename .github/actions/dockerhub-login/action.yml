# Docker Hub's anonymous pull limit is per IP, and GitHub runners share IPs; logged-in pulls
# (Testcontainers and image builds alike) count against the account instead.
name: Docker Hub login
description: Logs in to Docker Hub, or warns that image pulls will be anonymous when no username is set.

inputs:
  username:
    description: Docker Hub username, from the DOCKERHUB_USERNAME repository variable or secret.
    required: false
    default: ''
  token:
    description: Docker Hub access token, from the DOCKERHUB_TOKEN repository secret.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      if: inputs.username != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    # Without a username (not configured yet, or a pull request from a fork) pulls stay anonymous.
    - name: Warn that pulls are anonymous
      if: inputs.username == ''
      shell: bash
      run: echo "::warning title=Docker Hub::DOCKERHUB_USERNAME is not set as a repository variable or secret, so images are pulled anonymously and can hit Docker Hub's rate limit."
